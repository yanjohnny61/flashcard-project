<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS Term Flashcards</title>
 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
 
<style>
  /* Design tokens to reuse colors */
  :root {
    --color-bg: #F3EFE6;          /* flat warm beige page background */
    --color-card: #FBF9F4;        /* slightly lighter card surface */
    --color-border: #D9D0BC;      /* soft tan hairline border */
    --color-text: #2B2A26;        /* near-black warm text */
    --color-text-muted: #6E6759;  /* secondary/quiet text */
    --color-accent: #4B5A48;      /* muted olive - "definition" state */
    --color-accent-soft: #E7E2D3; /* light wash used behind the accent */
  }
 
  * {
    box-sizing: border-box;
  }
 
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--color-text);
    padding: 24px;
  }
 
  .app {
    width: 100%;
    max-width: 480px;
  }
 
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px 0;
  }
 
  .subtitle {
    font-size: 14px;
    color: var(--color-text-muted);
    margin: 0 0 28px 0;
    line-height: 1.5;
  }
 
  /* Flashcard styling */
  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 40px 28px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
    cursor: pointer;
  }
 
  .card-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--color-text-muted);
    margin-bottom: 10px;
  }
 
  /* Class is added/removed by JS depending on whether the definition is showing */
  .card.is-definition .card-label {
    color: var(--color-accent);
  }
 
  .card-text {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
  }
 
  .card.is-definition .card-text {
    font-size: 17px;
    font-weight: 400;
  }
 
  .hint {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 16px;
  }
 
  /* Control buttons */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 12px;
  }
 
  .nav-buttons {
    display: flex;
    gap: 8px;
  }
 
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text);
    cursor: pointer;
  }
 
  button:hover {
    background: var(--color-accent-soft);
  }
 
  button:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
 
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
 
  .progress {
    font-size: 13px;
    color: var(--color-text-muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
 
<div class="app">
  <h1>CS Term Flashcards</h1>
  <p class="subtitle">Click the card to flip between the term and its definition.</p>
 
  <!-- Card serves as flip button  -->
  <div class="card" id="card">
    <div class="card-label" id="cardLabel">TERM</div>
    <div class="card-text" id="cardText"></div>
  </div>
  <p class="hint">Click the card to reveal the definition</p>
 
  <div class="controls">
    <div class="nav-buttons">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</div>
 
<script>
  // Hardcoded data
  const flashcards = [
    { term: "Big O Notation", definition: "A way to describe how the runtime or memory use of an algorithm grows as the input size grows." },
    { term: "Recursion", definition: "When a function calls itself in order to solve a smaller version of the same problem." },
    { term: "Array", definition: "A data structure that stores a collection of items in order, accessed by an index number." },
    { term: "Hash Table", definition: "A data structure that maps keys to values using a hash function, giving fast average-case lookups." },
    { term: "Stack", definition: "A data structure where the last item added is the first one removed (LIFO)." },
    { term: "Queue", definition: "A data structure where the first item added is the first one removed (FIFO)." },
    { term: "Binary Search", definition: "A search algorithm that repeatedly cuts a sorted list in half to find a target value quickly." },
    { term: "Pointer", definition: "A variable that stores the memory address of another variable, rather than a value itself." },
    { term: "API", definition: "A set of rules that lets one piece of software request data or services from another." },
    { term: "Compiler", definition: "A program that translates source code written in one language into another language, usually machine code." }
  ];
 
  // Describes current state of app
  let currentIndex = 0;        // which flashcard we're on
  let showingDefinition = false; // whether showing term or definition
 
  // Grabs HTML elements to be modified with JS 
  const cardEl = document.querySelector("#card");
  const cardLabelEl = document.querySelector("#cardLabel");
  const cardTextEl = document.querySelector("#cardText");
  const progressEl = document.querySelector("#progress");
  const prevBtn = document.querySelector("#prevBtn");
  const nextBtn = document.querySelector("#nextBtn");
 
  /* render() is responsible for making the page match
    the current state. Called whenever state changes */
  function render() {
    const card = flashcards[currentIndex];
 
    if (showingDefinition) {
      cardLabelEl.textContent = "DEFINITION";
      cardTextEl.textContent = card.definition;
      cardEl.classList.add("is-definition");
    } else {
      cardLabelEl.textContent = "TERM";
      cardTextEl.textContent = card.term;
      cardEl.classList.remove("is-definition");
    }
 
    progressEl.textContent = `Card ${currentIndex + 1} of ${flashcards.length}`;
 
    // Disable "Previous" on the first card and "Next" on the last card
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === flashcards.length - 1;
  }
 
  // Event listeners connect user actions to state changes 
  // Clicking the card flips between term and definition
  cardEl.addEventListener("click", function () {
    showingDefinition = !showingDefinition;
    render();
  });
 
  // "Next" moves forward one card and resets to showing the term
  nextBtn.addEventListener("click", function () {
    if (currentIndex < flashcards.length - 1) {
      currentIndex = currentIndex + 1;
      showingDefinition = false;
      render();
    }
  });
 
  // "Previous" moves back one card and resets to showing the term
  prevBtn.addEventListener("click", function () {
    if (currentIndex > 0) {
      currentIndex = currentIndex - 1;
      showingDefinition = false;
      render();
    }
  });
 
  // Draw the very first card when the page loads
  render();
</script>
 
</body>
</html>
