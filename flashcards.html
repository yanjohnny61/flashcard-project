<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards</title>
 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
 
<link rel="stylesheet" href="styles.css">
<script src="flashcards.js" defer></script>
</head>
<body>
 
<div class="app">
  <h1>Flashcards</h1>
  <p class="subtitle">Click the card to flip between the term and its definition.</p>
 
  <!-- Card serves as flip button  -->
  <div class="card" id="card">
    <div class="card-label" id="cardLabel">TERM</div>
    <div class="card-text" id="cardText"></div>
  </div>

  <!-- Mastery bar -->
    <div class="mastery-bar" id="masteryBar">
      <div class="mastery-segment"></div>
      <div class="mastery-segment"></div>
      <div class="mastery-segment"></div>
    </div>
 
  <p class="hint">Click the card to reveal the definition</p>
 
  <div class="mastery-controls">
    <button id="dontKnowBtn">Don't Know</button>
    <button id="knowBtn">Know</button>
  </div>
 
  <div class="controls">
    <div class="nav-buttons">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <button id="deleteBtn" class="delete-btn">Delete This Card</button>

  <!-- Form for adding custom flashcards -->
  <div class="add-card">
    <h2>Add a card</h2>
    <form id="addCardForm">
      <input type="text" id="termInput" placeholder="Term" required />
      <input type="text" id="definitionInput" placeholder="Definition" required />
      <button type="submit">Add Card</button>
    </form>
  </div>

</div>
</body>
</html>
